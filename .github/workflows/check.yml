name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r infonet/requirements.txt
      - name: Check repository contents
        run: python scripts/repository_check.py
      - name: Check application
        run: python scripts/check.py
